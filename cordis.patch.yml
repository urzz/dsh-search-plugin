# Requires the standard DSH base bundle (web service, HTTP fetch and tool consumer).
- id: web
  config:
    searchProvider: codex
    fetchProvider: search-http

- insert:
    # DSH discovers the browser module only on a bare-package Loader entry.
    - id: dsh-search-ui
      name: dsh-search-plugin
      config:
        uiOnly: true
    - id: dsh-search-plugin
      name: dsh-search-plugin/search
      config:
        authMode: !!js process.env.DSH_CODEX_AUTH_MODE || 'openai'
        endpoint: !!js process.env.DSH_CODEX_ENDPOINT
        apiKey: !!js process.env.DSH_CODEX_API_KEY
    - id: dsh-search-fetch
      name: dsh-search-plugin/fetch
